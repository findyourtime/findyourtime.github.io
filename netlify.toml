[build]
  publish = "."

# Anciennes URL des guides (.html) vers les URL propres en dossier.
# Ne jamais remettre de fichier à ces chemins : un guides/<slug>.html à côté
# d'un guides/<slug>/index.html se dispute l'URL sans extension, et Netlify
# sert le fichier plutôt que le dossier.
[[redirects]]
  from = "/guides/ceinture-10-13mm.html"
  to = "/guides/ceinture-10-ou-13-mm/"
  status = 301

[[redirects]]
  from = "/guides/levier-boucle.html"
  to = "/guides/levier-boucle/"
  status = 301

[[redirects]]
  from = "/guides/genouilleres.html"
  to = "/guides/genouilleres/"
  status = 301

[[redirects]]
  from = "/guides/homologation-ipf.html"
  to = "/guides/homologation-ipf/"
  status = 301

# Outillage de développement (.claude/skills). Le site publie la racine
# entière, donc on refuse explicitement de servir ce dossier plutôt que de
# dépendre du traitement des fichiers cachés par l'hébergeur.
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
