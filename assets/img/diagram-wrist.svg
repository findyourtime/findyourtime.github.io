<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma d'un wrist wrap enroulé sur le poignet">
  <!-- forearm/wrist -->
  <path d="M120 40 C 100 90 100 170 120 220" fill="none" stroke="#1E2023" stroke-width="3"/>
  <path d="M260 40 C 280 90 280 170 260 220" fill="none" stroke="#1E2023" stroke-width="3"/>
  <!-- wrap turns -->
  <path d="M115 95 C 170 80 210 80 265 95" fill="none" stroke="#C41E3A" stroke-width="6" stroke-linecap="round"/>
  <path d="M112 125 C 170 108 210 108 268 125" fill="none" stroke="#C41E3A" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <path d="M112 155 C 170 138 210 138 268 155" fill="none" stroke="#C41E3A" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- thumb loop -->
  <path d="M190 40 v-18 a10 10 0 0 1 20 0 v18" fill="none" stroke="#1E2023" stroke-width="3"/>
</svg>
