<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coupe schématique d'une ceinture de force athlétique">
  <rect x="0" y="0" width="400" height="260" fill="none"/>
  <!-- belt band, side profile -->
  <path d="M40 150 h240 a20 20 0 0 1 20 20 v10 a20 20 0 0 1 -20 20 h-240 a20 20 0 0 1 -20 -20 v-10 a20 20 0 0 1 20 -20 Z" fill="none" stroke="#1E2023" stroke-width="3"/>
  <!-- thickness bracket -->
  <line x1="18" y1="148" x2="18" y2="202" stroke="#C41E3A" stroke-width="3"/>
  <line x1="10" y1="148" x2="26" y2="148" stroke="#C41E3A" stroke-width="3"/>
  <line x1="10" y1="202" x2="26" y2="202" stroke="#C41E3A" stroke-width="3"/>
  <!-- stitch lines -->
  <line x1="60" y1="158" x2="270" y2="158" stroke="#1E2023" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <line x1="60" y1="192" x2="270" y2="192" stroke="#1E2023" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <!-- buckle -->
  <rect x="290" y="140" width="60" height="40" rx="4" fill="none" stroke="#1E2023" stroke-width="3"/>
  <line x1="320" y1="140" x2="320" y2="180" stroke="#1E2023" stroke-width="3"/>
  <circle cx="332" cy="160" r="4" fill="#1E2023"/>
  <!-- holes on strap -->
  <circle cx="100" cy="175" r="4" fill="none" stroke="#1E2023" stroke-width="2"/>
  <circle cx="130" cy="175" r="4" fill="none" stroke="#1E2023" stroke-width="2"/>
  <circle cx="160" cy="175" r="4" fill="none" stroke="#1E2023" stroke-width="2"/>
</svg>
